workflows:
  android-workflow:
    name: Gym Genius Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase_credentials   # GOOGLE_SERVICES_JSON (base64)
        - app_secrets            # GEMINI_API_KEY

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/app/android/local.properties"

      - name: Decode google-services.json
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > "$CM_BUILD_DIR/app/android/app/google-services.json"

      - name: Write .env file
        script: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > "$CM_BUILD_DIR/app/.env"

      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get

      - name: Flutter analyze
        script: |
          cd app
          flutter analyze --no-fatal-infos

      - name: Build Android APK (debug)
        script: |
          cd app
          flutter build apk --debug

    artifacts:
      - app/build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - yashkoolwal2048@gmail.com
        notify:
          success: true
          failure: true
